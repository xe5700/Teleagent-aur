# teleagent AUR 包自动更新 workflow
#
# 定期（默认每天 08:00 UTC / 北京 16:00）检测官网是否发布新版本：
#   - 有新版本：下载两架构包、刷新 PKGBUILD/.SRCINFO，自动 commit + push
#   - 无新版本：跳过（不下载 800MB 安装包），不产生提交
#
# 也可在仓库页 Actions 标签手动触发（Run workflow）。
#
# 依赖：Python 3 + requests（workflow 内自动安装），需仓库具备本目录文件
# （update.sh / update.py / PKGBUILD / .SRCINFO）。

name: Auto-update AUR package

on:
  schedule:
    - cron: '0 8 * * *'   # 每天 08:00 UTC
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write         # 允许向仓库推送提交

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 让 origin 带上 GITHUB_TOKEN 凭据，后续 git push 可直接使用
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: python -m pip install requests

      - name: Detect & update PKGBUILD
        run: bash ./update.sh

      - name: Commit and push if newer
        run: |
          if ! git diff --quiet -- PKGBUILD .SRCINFO; then
            git config user.name "teleagent-autoupdater"
            git config user.email "41842988+github-actions[bot]@users.noreply.github.com"
            VER="$(sed -n 's/^pkgver=//p' PKGBUILD)"
            git add PKGBUILD .SRCINFO
            git commit -m "upgpkg: teleagent ${VER}"
            git push origin HEAD
            echo "已发布新版本 teleagent ${VER}"
          else
            echo "当前已是最新，无提交。"
          fi